<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Live Attendance Logs</title>

  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      color: #58a6ff;
      margin-bottom: 30px;
    }

    /* ✅ NAVIGATION BAR */
    .nav {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 30px;
    }

    .nav-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      color: #9ecbff;
      text-decoration: none;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(88, 166, 255, 0.2);
      border-color: rgba(88, 166, 255, 0.4);
      transform: translateY(-2px);
    }

    /* ✅ CARD */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.35);
    }

    /* ✅ TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    th {
      background: #161b22;
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #30363d;
      color: #9ecbff;
      font-weight: 500;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #21262d;
    }

    tr:hover {
      background: #161b22;
    }
  </style>
</head>

<body>

  <!-- ✅ NAVIGATION -->
  <div class="nav">
    <a href="/home" class="nav-btn">Home</a>
    <a href="/" class="nav-btn">Panel</a>
    <a href="/logs_page" class="nav-btn">Logs</a>
  </div>

  <h1>Live Attendance Logs</h1>

  <div class="card">
    <input type="text" id="logSearch" placeholder="Search logs..." onkeyup="filterLogs()"
      style="margin-bottom: 20px; width: 200px;">


    <table id="logsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Finger ID</th>
          <th>Name</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const BASE_URL = window.location.origin;

    async function loadLogs() {
      const res = await fetch(`${BASE_URL}/logs`);
      const logs = await res.json();
      renderLogs(logs);
    }

    function renderLogs(logs) {
      const tbody = document.querySelector("#logsTable tbody");
      tbody.innerHTML = "";

      logs.forEach(l => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td>${l.id}</td>
        <td>${l.finger_id}</td>
        <td>${l.name || "(unknown)"}</td>
        <td>${l.timestamp}</td>
      `;
        tbody.appendChild(tr);
      });

      // ✅ Keep search active after refresh
      filterLogs();
    }

    // ✅ Define filterLogs globally
    function filterLogs() {
      const query = document.getElementById("logSearch").value.toLowerCase();
      const rows = document.querySelectorAll("#logsTable tbody tr");

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(query) ? "" : "none";
      });
    }

    // ✅ Auto-refresh logs every 2 seconds
    loadLogs();
    setInterval(loadLogs, 2000);
  </script>

</body>

</html>
